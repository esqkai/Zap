name: Desktop preview builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-builds.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop and build dependencies
        run: python -m pip install ".[desktop,dev]" pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name NxxtLevel --collect-all PySide6 src/nxxt_level/desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: NxxtLevel-Windows-preview
          path: dist/NxxtLevel.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Install desktop and build dependencies
        run: python -m pip install ".[desktop,dev]" pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build Linux executable bundle
        run: pyinstaller --noconfirm --clean --windowed --onedir --name NxxtLevel --collect-all PySide6 src/nxxt_level/desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: NxxtLevel-Linux-preview
          path: dist/NxxtLevel/

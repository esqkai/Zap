[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nxxt-level"
version = "0.1.0"
description = "Zap - Desktop Control Center for MTTL-W01 Smart Power Strips by Nxxt Level"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [
    {name = "Nxxt Level"}
]
keywords = ["smart-strip", "mttl-w01", "power-strip", "iot", "zap", "nxxt-level"]
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.5", "websockets>=12"]
sync = ["websockets>=12"]
dev = [
    "pytest>=7.0",
]

[project.scripts]
zap = "nxxt_level.cli:main"
nxxt-level = "nxxt_level.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as requiring network/async integration (deselect with '-m \"not integration\"')",
    "hardware: marks tests as requiring physical MTTL-W01 hardware",
]
